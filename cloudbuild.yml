steps:
  - name: 'gcr.io/://google.com'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        DAGS_BUCKET=$(gcloud composer environments describe credit-risk-composer-dev \
          --location=asia-south1 \
          --format="value(config.dagGcsPrefix)")
        gcloud storage rsync --recursive --delete-unmatched-destination-files dags/ "$$DAGS_BUCKET/"
options:
  logging: CLOUD_LOGGING_ONLY