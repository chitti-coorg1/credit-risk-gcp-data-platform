name: Deploy DAGs to Cloud Composer

on:
  push:
    branches: [main]
    paths: ["dags/**", "tests/**"]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt
          pytest tests/
